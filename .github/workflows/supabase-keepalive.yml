name: Supabase keepalive fallback

on:
  schedule:
    # 03:37 Asia/Shanghai every three days. The non-round minute reduces
    # GitHub Actions schedule congestion.
    - cron: '37 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out keepalive code
        uses: actions/checkout@v4

      - name: Write the Supabase heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_MAIN_TABLE: ${{ vars.SUPABASE_MAIN_TABLE }}
          SUPABASE_TRAVEL_INDEX_TABLE: ${{ vars.SUPABASE_TRAVEL_INDEX_TABLE }}
          SUPABASE_TRAVEL_DETAILS_TABLE: ${{ vars.SUPABASE_TRAVEL_DETAILS_TABLE }}
        run: node scripts/supabase-scheduled-keepalive.js
