name: Supabase keepalive fallback

on:
  schedule:
    # 03:37 Asia/Shanghai every three days. The non-round minute reduces
    # GitHub Actions schedule congestion.
    - cron: '37 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve current production deployment
        id: production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployments="$(
            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1"
          )"
          status_url="$(jq -r '.[0].statuses_url // empty' <<< "$deployments")"
          test -n "$status_url"

          statuses="$(
            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$status_url"
          )"
          production_url="$(jq -r 'map(select(.state == "success"))[0].environment_url // empty' <<< "$statuses")"
          test -n "$production_url"
          echo "keepalive_url=${production_url%/}/api/supabase-keepalive" >> "$GITHUB_OUTPUT"

      - name: Trigger production keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ steps.production.outputs.keepalive_url }}
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 90 \
            "$KEEPALIVE_URL"
