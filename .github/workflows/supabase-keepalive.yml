name: Supabase keepalive fallback

on:
  schedule:
    # 03:37 Asia/Shanghai every three days. The non-round minute reduces
    # GitHub Actions schedule congestion.
    - cron: '37 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger a production build heartbeat
        id: trigger
        run: |
          git pull --rebase origin main
          date --utc --iso-8601=seconds > .supabase-keepalive-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .supabase-keepalive-trigger
          git commit -m "chore: trigger scheduled Supabase keepalive"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the Vercel deployment
        env:
          COMMIT_SHA: ${{ steps.trigger.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..48}; do
            commit_status="$(
              curl \
                --fail-with-body \
                --show-error \
                --silent \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/status"
            )"
            vercel_state="$(jq -r '[.statuses[] | select(.context == "Vercel")][0].state // "pending"' <<< "$commit_status")"
            case "$vercel_state" in
              success)
                jq -r '[.statuses[] | select(.context == "Vercel")][0] | "Vercel deployment succeeded: \(.target_url)"' <<< "$commit_status"
                exit 0
                ;;
              failure|error)
                jq -r '[.statuses[] | select(.context == "Vercel")][0] | "Vercel deployment failed: \(.description) \(.target_url)"' <<< "$commit_status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment status."
          exit 1
