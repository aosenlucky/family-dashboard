name: Supabase keepalive fallback

on:
  schedule:
    # 03:37 Asia/Shanghai every three days. The non-round minute reduces
    # GitHub Actions schedule congestion.
    - cron: '37 19 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve current production deployment
        id: production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployments="$(
            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1"
          )"
          status_url="$(jq -r '.[0].statuses_url // empty' <<< "$deployments")"
          test -n "$status_url"

          statuses="$(
            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$status_url"
          )"
          deployment_url="$(jq -r 'map(select(.state == "success"))[0].environment_url // empty' <<< "$statuses")"
          test -n "$deployment_url"

          # Vercel's immutable deployment URL can be protected by a login redirect.
          # Derive the stable team production alias from its documented URL shape:
          # <project>-<deployment-id>-<team>.vercel.app.
          deployment_host="${deployment_url#*://}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          deployment_suffix="${deployment_host#"$repository_name"-}"
          team_domain="${deployment_suffix#*-}"
          test "$team_domain" != "$deployment_suffix"
          echo "keepalive_url=https://${repository_name}-${team_domain}/api/supabase-keepalive" >> "$GITHUB_OUTPUT"

      - name: Trigger production keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ steps.production.outputs.keepalive_url }}
        run: |
          response="$(
            curl \
              --fail-with-body \
              --show-error \
              --silent \
              --location \
              --retry 4 \
              --retry-delay 10 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 90 \
              --header "Accept: application/json" \
              "$KEEPALIVE_URL"
          )"
          jq . <<< "$response"
          jq -e '.success == true and .databaseRequests == 4 and .databaseWrites == 1' <<< "$response" > /dev/null
