<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机尺寸 · 日记预览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #edf1f6;
        color: #526985;
        font:
          13px/1.7 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        max-width: 820px;
        margin: auto;
        padding: 18px 20px;
      }
      a {
        color: #526985;
      }
      label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      select {
        min-height: 44px;
        padding: 8px;
        border: 1px solid #c9d5e5;
        border-radius: 9px;
        color: inherit;
        background: white;
      }
      main {
        width: 375px;
        max-width: 100%;
        margin: 0 auto 30px;
        border: 1px solid #c9d5e5;
        border-radius: 22px;
        overflow: hidden;
        background: white;
        box-shadow: 0 15px 40px #21334f15;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 812px;
      }
      @media (max-width: 500px) {
        header {
          flex-wrap: wrap;
          font-size: 11px;
        }
        main {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./?demo=1">返回完整示例</a
      ><label
        >屏幕尺寸<select id="size">
          <option value="375,812">375 × 812 · 手机</option>
          <option value="390,844">390 × 844 · 手机</option>
          <option value="667,375">667 × 375 · 横屏</option>
        </select></label
      >
    </header>
    <main id="device">
      <iframe id="frame" src="./?demo=1" title="日记手机尺寸预览"></iframe>
    </main>
    <script>
      document.getElementById("size").addEventListener("change", (event) => {
        const [w, h] = event.target.value.split(",");
        document.getElementById("device").style.width = w + "px";
        document.getElementById("frame").style.height = h + "px";
      });
    </script>
  </body>
</html>
