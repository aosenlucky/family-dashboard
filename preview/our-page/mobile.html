<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机预览 · 我们这一页</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9ece4;
        color: #4d5b44;
        font:
          13px/1.7 system-ui,
          "Microsoft YaHei",
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        max-width: 820px;
        margin: 0 auto;
        padding: 18px 20px;
      }
      a {
        color: #4d5b44;
        text-underline-offset: 4px;
      }
      select {
        min-height: 44px;
        padding: 8px;
        background: #f9faf5;
        border: 1px solid #c6d0bc;
        border-radius: 6px;
        color: #4d5b44;
      }
      main {
        margin: 0 auto 30px;
        width: 375px;
        max-width: 100%;
        border: 1px solid #bec7b1;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 15px 40px #2b40201c;
        background: #f8f6f0;
      }
      iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 812px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      @media (max-width: 500px) {
        header {
          flex-wrap: wrap;
          font-size: 11px;
        }
        main {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="./index.html">返回完整预览</a
      ><label
        >屏幕尺寸<select id="size">
          <option value="375,812">375 × 812 · 手机</option>
          <option value="390,844">390 × 844 · 手机</option>
          <option value="667,375">667 × 375 · 横屏</option>
        </select></label
      >
    </header>
    <main id="device">
      <iframe id="frame" src="./index.html" title="我们这一页手机预览"></iframe>
    </main>
    <script>
      const size = document.getElementById("size");
      size.addEventListener("change", () => {
        const [width, height] = size.value.split(",");
        document.getElementById("device").style.width = width + "px";
        document.getElementById("frame").style.height = height + "px";
      });
    </script>
  </body>
</html>
